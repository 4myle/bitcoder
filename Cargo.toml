[package]
description = "Bit string file creation by categorizing value-based text data."
name = "bitcoder"
authors = ["Roger Salomonsson <medicorab@gmail.com>"]
version = "1.0.14"
edition = "2024"

[dependencies]
eframe = { version = "0.34.2", default-features = false, features = ["glow", "persistence"] }
# egui_extras = "0.31.1"
serde  = "1.0.228"
regex  = "1.12.3"
dirs = "6.0.0"

[build-dependencies]
winresource = "0.1.31"

[profile.dev]
debug = 2
opt-level = 0
# split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = 1
opt-level = 3

[profile.release]
debug = 0
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "deny"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
